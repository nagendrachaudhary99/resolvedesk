name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resolvedesk
          POSTGRES_PASSWORD: resolvedesk
          POSTGRES_DB: resolvedesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resolvedesk"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Tests (unit + integration + failure injection, real Postgres)
        env:
          DATABASE_URL: postgresql+psycopg2://resolvedesk:resolvedesk@localhost:5432/resolvedesk
        run: cd backend && python -m pytest tests/ -q
      - name: Golden-set eval
        env:
          DATABASE_URL: postgresql+psycopg2://resolvedesk:resolvedesk@localhost:5432/resolvedesk
        run: cd backend && python scripts/eval.py --ci
      - name: Load smoke (100 tickets)
        env:
          DATABASE_URL: postgresql+psycopg2://resolvedesk:resolvedesk@localhost:5432/resolvedesk
        run: cd backend && python scripts/load_test.py -n 100 --ci

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package.json}
      - run: cd frontend && npm install && npm run build
