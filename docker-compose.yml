services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resolvedesk
      POSTGRES_PASSWORD: resolvedesk
      POSTGRES_DB: resolvedesk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolvedesk"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://resolvedesk:resolvedesk@db:5432/resolvedesk
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://resolvedesk:resolvedesk@db:5432/resolvedesk
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
